services:
  postgres:
    image: postgres:16-alpine
    container_name: kobbys-intertech-postgres
    environment:
      POSTGRES_DB: kobbys_intertech
      POSTGRES_USER: kobbys
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kobbys -d kobbys_intertech"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
